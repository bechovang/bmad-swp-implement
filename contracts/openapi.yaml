# =============================================================================
# StorageHub API contract - the single source of truth for the API surface (AD-2).
#
# Rules of engagement:
#   - Frozen at sprint start; want a change? PR into this file FIRST, code after.
#   - The FE generates types and MSW mocks from this file; BE endpoints must match.
#   - springdoc (backend) renders docs only - generated docs are never the contract.
#
# Conventions (AD-7 / AD-8):
#   - Money: JSON number, whole VND, never float on either side.
#   - Timestamps: ISO-8601 with offset (stored UTC, displayed Asia/Ho_Chi_Minh).
#   - Enums: UPPER_SNAKE strings. JSON fields: camelCase. Filter/sort params: kebab-case.
#   - Lists: ListEnvelope with 1-based page, default pageSize 25.
#   - Every error - including security layer 401/403 - uses the Error envelope.
#
# Story 1.1 ships the skeleton (info + Error + ListEnvelope). Paths land here
# sprint by sprint; the first ones are the epic 1 auth endpoints.
# =============================================================================
openapi: 3.1.0
info:
  title: StorageHub API
  version: 1.0.0
  description: >
    REST API of the StorageHub self-service storage management system.
    All endpoints live under the `/api/v1` prefix. Everything except the
    explicitly public endpoints requires a JWT Bearer token (AD-5).

servers:
  - url: /api/v1
    description: Same-origin (Vite dev proxy / SPA-served deployment)

# Default security: JWT everywhere. Public endpoints (e.g. POST /auth/login)
# override this with `security: []` when they are added.
security:
  - bearerAuth: []

paths:

  # ------------------------------------------------------------ auth (1.3)
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in with email and password
      description: >
        Public. Returns a JWT Bearer token (HS256, claims sub/role/iat/exp,
        24h TTL, no refresh token - AD-5). Every failure branch - unknown
        email, wrong password, inactive or locked account - answers the SAME
        401 envelope message and never reveals which field failed. Both
        successful and failed attempts are audited as LOGIN / LOGIN_FAILED.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token plus the signed-in user (role is UPPER_SNAKE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Self-register a customer account
      description: >
        Public. Customer-only self-register: the API accepts no role field
        (an extra JSON field is ignored) and always creates a CUSTOMER user
        with Status=1 (active) and a BCrypt password hash. Register is not
        audited (no REGISTER action in the 1.2 registry).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The created user - always role CUSTOMER, status active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Request a password reset (P2 stub)
      description: >
        Public. Always answers the same generic 200 whether or not the email
        matches an account - never reveals account existence. No real email
        is sent in v1 (P2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic acknowledgment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  # ----------------------------------------------------- notifications (1.6)
  /notifications/unread-count:
    get:
      operationId: getUnreadCount
      tags: [Notifications]
      summary: Get unread notifications count
      description: >
        Returns the unread notifications count for the authenticated user.
        Dedicated lightweight endpoint polled by the top-bar bell icon.
      responses:
        '200':
          description: Total unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications:
    get:
      operationId: getNotifications
      tags: [Notifications]
      summary: List notifications for the authenticated user
      description: >
        Returns paginated notifications scoped strictly to the authenticated
        user, ordered unread first (isRead ASC, createdAt DESC).
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page index.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 25
          description: Rows per page.
      responses:
        '200':
          description: List of notifications in standard ListEnvelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark a single notification as read
      description: >
        Marks the specified notification as read. Fails with 403 FORBIDDEN if
        the notification belongs to another user, or 404 NOT_FOUND if it does
        not exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Notification ID.
      responses:
        '200':
          description: The updated notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Mark all notifications as read
      description: >
        Marks all notifications belonging to the authenticated user as read.
        Returns the reset unread count (0).
      responses:
        '200':
          description: Confirmation with zero unread count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ----------------------------------------------------------- units (2.1, 2.2)
  /units/browse:
    get:
      operationId: browseUnits
      tags: [Units]
      summary: Browse and filter available storage units with turnover buffer availability
      description: >
        Returns list of bookable storage units (immediately available or in turnover buffer cleaning)
        derived on-read from active reservations and turnover buffer policy rules.
        Excludes units in RENTED, MAINTENANCE, or RETIRED status.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Filter by unit type name (e.g. Locker, S, M, L).
        - name: size
          in: query
          required: false
          schema:
            type: string
          description: Filter by unit size (e.g. Small, Medium, Large or exact match).
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Desired start date (YYYY-MM-DD).
        - name: durationMonths
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 120
            default: 1
          description: Desired rental duration in months.
      responses:
        '200':
          description: List of units matching filter criteria and total live count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseUnitsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /units/{code}:
    get:
      operationId: getUnitDetail
      tags: [Units]
      summary: Get unit detail by code
      description: >
        Returns unit specification, facility info, monthly rate, deposit rate,
        and security features for a specific unit code.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Unique unit code (e.g. S-3, M-5).
      responses:
        '200':
          description: Detailed unit specifications and pricing base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitDetailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------- pricing (2.1)
  /pricing/calculate:
    get:
      operationId: calculatePricing
      tags: [Pricing]
      summary: Calculate rental price breakdown
      description: >
        Computes itemized rental pricing (base rent, surcharges, and refundable deposit)
        using the backend PricingEngine and active RentalPolicy.
      parameters:
        - name: unitCode
          in: query
          required: true
          schema:
            type: string
          description: Unit code to calculate pricing for (e.g. S-3).
        - name: durationMonths
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 120
          description: Number of rental months (must be between 1 and 120).
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Desired start date (YYYY-MM-DD). Defaults to current date.
      responses:
        '200':
          description: Pricing breakdown calculation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingBreakdownDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT with role claim, 24h TTL, no refresh token (AD-5). Logout is the
        client dropping the token.

  # D6 reusable non-2xx bodies (deferred from 1.1, landed with the first
  # auth paths in 1.3): every usage renders the same Error envelope.
  responses:

    NotFound:
      description: >
        Resource was not found. Error envelope, code NOT_FOUND (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: >
        Missing, invalid or expired Bearer token - or bad credentials /
        inactive / locked account at login. Error envelope, code
        UNAUTHENTICATED (401). Carries `WWW-Authenticate: Bearer` on guarded
        paths. At login every failure branch shares one generic message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: >
        Authenticated but the token's role is not allowed on this endpoint
        (server-side permission matrix). Error envelope, code FORBIDDEN (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: >
        Request body failed validation (missing/invalid fields, duplicate
        email, password confirmation mismatch, terms not accepted). Error
        envelope, code VALIDATION_FAILED (400) with one fieldError per
        offending field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ------------------------------------------------------------------ error
    Error:
      type: object
      description: >
        The one error envelope for every non-2xx response, including security
        (401/403) and business-rule blocks (409). The FE renders toasts from
        this data and never parses the human message.
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          description: >
            Machine-readable, stable, UPPER_SNAKE. Two layers share this field.
            Framework codes, issued by the backend error envelope for every
            non-2xx response including security 401/403: VALIDATION_FAILED
            (400, with fieldErrors), MALFORMED_REQUEST (400), UNAUTHENTICATED
            (401), FORBIDDEN (403), NOT_FOUND (404), METHOD_NOT_ALLOWED (405),
            UNSUPPORTED_MEDIA_TYPE (415), INTERNAL_ERROR (500, generic message
            only). Business codes are declared by each operation when its path
            lands in this file and travel in this same field; a business-rule
            block maps to 409.
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples:
            - VALIDATION_FAILED
            - UNIT_UNAVAILABLE
            - BLOCKED_TRANSITION
        message:
          type: string
          description: Human-readable one-liner (what happened + consequence + next step).
        fieldErrors:
          type: array
          description: Present for validation failures; empty or absent otherwise.
          items:
            $ref: '#/components/schemas/FieldError'
        # Blocked-transition payloads (FR-22 snap-back) add the violated guard
        # and the missing closing step as structured data when that endpoint
        # lands - the FE renders the toast from these fields, not the message.

    FieldError:
      type: object
      required:
        - field
        - message
      additionalProperties: false
      properties:
        field:
          type: string
          description: camelCase JSON path of the offending field.
        message:
          type: string

    # ------------------------------------------------------------------- list
    ListEnvelope:
      type: object
      description: >
        Offset pagination envelope for every list endpoint. `page` is 1-based;
        `pageSize` defaults to 25 (FR-26/28/31). Per-resource usages refine
        `items` (e.g. ListOfUnits) but never change these four fields.
      required:
        - items
        - page
        - pageSize
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          description: The page's rows. Item schema is refined per endpoint.
          items: {}
        page:
          type: integer
          minimum: 1
          description: Current page, 1-based.
          examples:
            - 1
        pageSize:
          type: integer
          minimum: 1
          default: 25
          description: Rows per page.
        total:
          type: integer
          minimum: 0
          description: Total rows matching the filter.

    # ----------------------------------------------------------------- auth
    LoginRequest:
      type: object
      description: Sign-in payload. Failures never reveal which field was wrong.
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          maxLength: 72
          description: Plain password; compared against the BCrypt hash server-side.

    RegisterRequest:
      type: object
      description: >
        Customer self-register payload. No role field exists - an extra JSON
        field is ignored and the created user is always CUSTOMER. The
        cross-field rules (password == confirmPassword, agreeToTerms true)
        are enforced server-side with fieldErrors on confirmPassword /
        agreeToTerms.
      required:
        - fullName
        - phone
        - email
        - password
        - confirmPassword
        - agreeToTerms
      additionalProperties: true
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          maxLength: 72
        confirmPassword:
          type: string
          maxLength: 72
        agreeToTerms:
          type: boolean
          description: Must be true; false answers 400 with fieldErrors[agreeToTerms].

    ForgotPasswordRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 100

    Role:
      type: string
      description: >
        Role name, UPPER_SNAKE - identical in the JWT role claim, the login
        response and contracts/routes.yaml role keys.
      enum:
        - CUSTOMER
        - STAFF
        - FACILITY_MANAGER
        - BUSINESS_OPS
        - SYSTEM_ADMINISTRATOR

    AuthUser:
      type: object
      description: The signed-in user as returned by login.
      required:
        - id
        - fullName
        - email
        - role
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        phone:
          type: string
          nullable: true

    LoginResponse:
      type: object
      description: JWT plus the signed-in user. Logout = the client drops the token.
      required:
        - token
        - user
      additionalProperties: false
      properties:
        token:
          type: string
          description: >
            Signed JWT (HS256). Claims: sub = UserID, role = UPPER_SNAKE
            Role, iat, exp (24h). No refresh token (AD-5).
        user:
          $ref: '#/components/schemas/AuthUser'

    RegisterResponse:
      type: object
      description: The created account - always CUSTOMER and active (Status=1).
      required:
        - id
        - fullName
        - email
        - role
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        phone:
          type: string
          nullable: true

    ForgotPasswordResponse:
      type: object
      description: Generic acknowledgment - identical whether or not the account exists.
      required:
        - message
      additionalProperties: false
      properties:
        message:
          type: string

    # --------------------------------------------------------- notifications
    UnreadCountResponse:
      type: object
      description: Unread notification count for the authenticated user.
      required:
        - count
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of unread notifications.

    NotificationDto:
      type: object
      description: A notification record scoped to a user.
      required:
        - id
        - userId
        - type
        - title
        - isRead
        - createdAt
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        type:
          type: string
          description: Type code (e.g. PAYMENT_SUCCEEDED, TASK_ASSIGNED).
        title:
          type: string
          description: Human-readable notification summary.
        deepLink:
          type: string
          nullable: true
          description: Relative FE path resolving against contracts/routes.yaml.
        isRead:
          type: boolean
          description: Whether the user has marked this notification as read.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp in ISO-8601 format.

    NotificationListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NotificationDto'

    ToastNotification:
      type: object
      description: Ephemeral feedback payload for mutations.
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
        tone:
          type: string
          enum: [info, success, warning, error]
          default: info
        deepLink:
          type: string
          nullable: true
          description: Relative FE path for optional single action link.

    # ----------------------------------------------------------- units & pricing
    UnitDetailDto:
      type: object
      description: Complete unit details for unit page view.
      required:
        - id
        - code
        - typeName
        - facilityName
        - facilityAddress
        - zoneCode
        - floor
        - sizeM2
        - accessType
        - status
        - imageUrl
        - monthlyRate
        - depositRate
        - securityFeatures
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          example: 'S-3'
        typeName:
          type: string
          example: 'S'
        typeDescription:
          type: string
          nullable: true
          example: 'Small unit around 5 m2'
        facilityName:
          type: string
          example: 'Tan Binh Depot'
        facilityAddress:
          type: string
          example: '45 Nguyen Van Troi, Tan Binh, Ho Chi Minh City'
        zoneCode:
          type: string
          example: 'A'
        floor:
          type: integer
          example: 1
        sizeM2:
          type: number
          format: double
          example: 5.0
        accessType:
          type: string
          example: 'PIN'
        status:
          type: string
          example: 'AVAILABLE'
        imageUrl:
          type: string
          example: '/units/S-3.jpg'
        monthlyRate:
          type: integer
          description: Base monthly rate in VND.
          example: 345000
        depositRate:
          type: integer
          description: Deposit rate percentage (e.g. 10 for 10%).
          example: 10
        securityFeatures:
          type: array
          items:
            type: string
          example:
            - '24/7 CCTV Monitoring'
            - 'Personal Access Code (PIN)'
            - 'Individually Alarmed Unit'
            - 'Climate & Humidity Controlled'
            - 'Fire Protection & Sprinklers'

    BrowseUnitDto:
      type: object
      description: Unit card summary for discovery grid with turnover buffer availability.
      required:
        - id
        - code
        - typeName
        - zoneCode
        - floor
        - sizeM2
        - accessType
        - status
        - imageUrl
        - monthlyRate
        - depositRate
        - availabilityStatus
        - availableFromDate
        - isImmediatelyAvailable
        - isInCleaningBuffer
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          example: 'S-3'
        typeName:
          type: string
          example: 'S'
        typeDescription:
          type: string
          nullable: true
          example: 'Small unit around 5 m2'
        zoneCode:
          type: string
          example: 'A'
        facilityName:
          type: string
          example: 'Tan Binh Depot'
        floor:
          type: integer
          example: 1
        sizeM2:
          type: number
          format: double
          example: 5.0
        accessType:
          type: string
          example: 'PIN'
        status:
          type: string
          example: 'PREPARING'
        imageUrl:
          type: string
          example: '/units/S-3.jpg'
        monthlyRate:
          type: integer
          description: Monthly rate in VND.
          example: 345000
        depositRate:
          type: integer
          description: Deposit rate percentage (e.g. 10 for 10%).
          example: 10
        availabilityStatus:
          type: string
          description: Human-readable availability label (e.g. "Available now" or "Available Oct 5 · cleaning buffer").
          example: 'Available Oct 5 · cleaning buffer'
        availableFromDate:
          type: string
          format: date
          description: Earliest date the unit can be occupied.
          example: '2026-10-05'
        isImmediatelyAvailable:
          type: boolean
          example: false
        isInCleaningBuffer:
          type: boolean
          example: true

    BrowseUnitsResponse:
      type: object
      description: Response payload for unit discovery catalog.
      required:
        - items
        - totalAvailable
        - totalUnits
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BrowseUnitDto'
        totalAvailable:
          type: integer
          description: Total number of bookable units currently matching filter.
          example: 2
        totalUnits:
          type: integer
          description: Total number of bookable units (available + buffer) in facility.
          example: 2

    SurchargeItemDto:
      type: object
      description: Line item surcharge.
      required:
        - type
        - name
        - amount
      additionalProperties: false
      properties:
        type:
          type: string
          example: 'SURCHARGE'
        name:
          type: string
          example: 'Late checkout surcharge'
        amount:
          type: integer
          example: 0
        description:
          type: string
          nullable: true
          example: '5% surcharge capped at 10%'

    PricingBreakdownDto:
      type: object
      description: Itemized rental pricing calculation result.
      required:
        - unitCode
        - durationMonths
        - monthlyRate
        - baseRent
        - surcharges
        - totalRent
        - depositRate
        - depositAmount
        - depositRefundable
        - totalDueNow
        - currency
      additionalProperties: false
      properties:
        unitCode:
          type: string
          example: 'S-3'
        durationMonths:
          type: integer
          example: 3
        monthlyRate:
          type: integer
          description: Unit monthly rate in VND.
          example: 345000
        baseRent:
          type: integer
          description: Monthly rate * durationMonths.
          example: 1035000
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/SurchargeItemDto'
        totalRent:
          type: integer
          description: Total rent including any applicable surcharges.
          example: 1035000
        depositRate:
          type: integer
          description: Deposit rate percentage.
          example: 10
        depositAmount:
          type: integer
          description: Refundable deposit amount in VND.
          example: 103500
        depositRefundable:
          type: boolean
          example: true
        totalDueNow:
          type: integer
          description: Amount due immediately upon reservation (deposit).
          example: 103500
        currency:
          type: string
          default: 'VND'
          example: 'VND'
        policyVersion:
          type: string
          example: 'v3'


